<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>F1 Engineering GP</title><link rel="stylesheet" href="style.css?v=3"></head><body><main><header><strong>F1 <span>ENGINEERING GP</span></strong><small>3 LAPS · FASTEST LAP WINS</small></header><div class="setup"><label>DRIVER <input id="name" maxlength="16" placeholder="Your name" value="Driver"></label><label>CIRCUIT <select id="circuit"><option value="speed">Speed Ring · Easy</option><option value="technical">Technical Circuit · Medium</option><option value="grand">Grand Prix · Hard</option></select></label></div><section class="hud"><div><small>LAP</small><b id="lap">1 / 3</b></div><div><small>CURRENT</small><b id="current">0:00.000</b></div><div><small>BEST</small><b id="best">--:--.---</b></div><div><small>SPEED</small><b id="speed">0 km/h</b></div></section><div class="track-wrap"><canvas id="track" width="800" height="520"></canvas><div id="overlay"><div id="overlayText">CHOOSE YOUR CIRCUIT</div><button id="start">START RACE</button></div></div><section class="energy"><span>MGU-K BATTERY</span><div class="battery"><div id="batteryFill"></div></div><b id="batteryText">80%</b></section><p id="status">Low drag on straights · high downforce in corners · brake to recharge</p><section class="controls"><button id="brake" class="brake">BRAKE<br><small>RECHARGE</small></button><button id="aero" class="aero">AERO<br><small>LOW DRAG</small></button><button id="boost" class="boost">MGU-K<br><small>BOOST</small></button><button id="gas" class="gas">ACCELERATE<br><small>HOLD</small></button></section><section class="history"><b>LAP HISTORY</b><div id="history">No completed laps yet</div></section></main><script src="game.js?v=3"></script></body></html>
