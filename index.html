<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b101b"><title>F1 Engineering GP</title><link rel="stylesheet" href="style.css"></head><body><main><header><b>F1 <span>ENGINEERING GP</span></b><small>3-LAP TIME ATTACK</small></header><section id="menu" class="panel"><h1>CHOOSE YOUR CIRCUIT</h1><p>Race using aerodynamics, braking and hybrid energy.</p><label>DRIVER NAME<input id="name" maxlength="16" placeholder="Driver" autocomplete="off"></label><label>CAR COLOR<input id="color" type="color" value="#f53942"></label><div id="tracks" class="trackcards"></div><button id="start" class="primary">START RACE →</button></section><section id="race" hidden><div class="stats"><div><small>LAP</small><strong id="lap">1/3</strong></div><div><small>CURRENT</small><strong id="current">0:00.000</strong></div><div><small>BEST</small><strong id="best">--:--.---</strong></div></div><div class="viewport"><canvas id="scene" width="720" height="680"></canvas><div class="telemetry"><span id="speed">0 km/h</span><span id="zone">STRAIGHT</span></div></div><div class="energy"><div><b>MGU-K ENERGY</b><span id="energytext">80%</span></div><div class="meter"><div id="energybar"></div></div></div><div class="controls"><button id="gas" class="gas">ACCELERATE</button><button id="brake" class="brake">BRAKE<br>+ REGEN</button><button id="boost" class="boost">⚡ MGU-K<br>BOOST</button><button id="aero" class="aero">LOW DRAG<br><small>TAP TO SWITCH</small></button></div><div id="message" class="message">Hold ACCELERATE to drive.</div><div class="panel history"><b>LAP TIMES</b><div id="history">Complete a lap to record a time.</div></div></section><section id="finish" class="panel" hidden><h1>🏁 FINISH!</h1><p id="summary"></p><div class="record" id="result"></div><div id="finalhistory"></div><button id="again" class="primary">RACE AGAIN</button><button id="menuBtn" class="secondary">CHANGE TRACK</button></section></main><script src="game.js"></script></body></html>
